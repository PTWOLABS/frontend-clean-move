name: Continuous Integration

on:
  pull_request:

jobs:
  validate-pr-flow:
    name: Validate PR Flow
    runs-on: ubuntu-latest
    steps:
      - name: Validate source and target branches
        run: |
          echo "Base branch: ${{ github.base_ref }}"
          echo "Head branch: ${{ github.head_ref }}"

          if [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "staging" ]; then
            echo "❌ Pull requests para a branch main só podem vir da branch staging."
            echo "Branch atual de origem: ${{ github.head_ref }}"
            exit 1
          fi

          echo "✅ Fluxo de Pull Request válido."

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    needs: validate-pr-flow
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run format:check

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: validate-pr-flow
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: validate-pr-flow
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate-pr-flow
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run test:run

  # E2E desativado por agora — para voltar a correr no CI, remove as duas linhas seguintes (`if` + comentário).
  e2e-tests:
    if: false
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: validate-pr-flow
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Subir Next.js e correr Cypress
        run: |
          npm run start &
          npx --yes wait-on@8 http://127.0.0.1:3000 --timeout 120000
          npm run cypress:run
        env:
          CI: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: validate-pr-flow
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build
